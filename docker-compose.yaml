services:
  redis:
    image: redis:8-alpine
    container_name: issus_ticket_redis
    ports:
      - "6379:6379"
    volumes:
      - issus_ticket_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grpc:
    container_name: ptd-api-LLM-grpc
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    env_file:
      - .env
    environment:
      - GRPC_PORT=50051
    volumes:
      - /src/.venv
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    container_name: ptd-api-LLM-worker
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=info
      - -n
      - worker1@%h
      - --concurrency=2
    env_file:
      - .env
    volumes:
      - /src/.venv
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  issus_ticket_redis_data:
