services:
  redis:
    image: redis:8-alpine          # ใช้ alpine ลด image size
    container_name: issus_ticket_redis
    ports:
      - "6379:6379"
    volumes:
      - issus_ticket_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: ptd-api-LLM
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - /src/.venv
    depends_on:
      redis:
        condition: service_healthy  # รอให้ Redis พร้อมก่อน
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    container_name: ptd-api-LLM-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker",
              "--loglevel=info", "-n", "worker1@%h",
              "--concurrency=2"]     # ควรระบุ concurrency ให้ชัดเจน
    env_file:
      - .env
    volumes:
      - /src/.venv
    depends_on:
      redis:
        condition: service_healthy  # ✅ ต้องการแค่ Redis
    restart: unless-stopped

volumes:
  issus_ticket_redis_data: